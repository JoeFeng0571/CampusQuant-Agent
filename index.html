<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>CampusQuant</title>
    <script>
        // 入口分发器：
        //   本会话首次进 / → 跳 splash.html 播欢迎动画 → 动画结束跳 dashboard.html
        //   本会话已看过 → 直接跳 dashboard.html（站内跳回 / 不重播,刷新也不重播）
        // 用 sessionStorage:关闭浏览器/开新窗口/新标签 视为"重新打开",再次播放(契合演示场景)。
        // 顺手清掉旧版残留的 localStorage 标记。
        (function () {
            var seen = false;
            try {
                localStorage.removeItem('hasSeenSplash');
                seen = !!sessionStorage.getItem('hasSeenSplash');
            } catch (e) { /* 隐私模式/禁用存储时容错 */ }
            window.location.replace(seen ? 'dashboard.html' : 'splash.html');
        })();
    </script>
    <!-- 无脚本 fallback：直接到控制台 -->
    <meta http-equiv="refresh" content="0; url=dashboard.html">
</head>
<body></body>
</html>
