<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- 预热 dashboard 的关键资源：splash 加载即在后台拉取,动画跑完跳转时已命中浏览器缓存,
         消除"淡出完成 → 深色空屏 → dashboard 终于渲染"的 2 秒空窗。 -->
    <link rel="prefetch" href="dashboard.html" as="document">
    <link rel="prefetch" href="assets/css/tokens.css" as="style">
    <link rel="prefetch" href="assets/css/base.css" as="style">
    <link rel="prefetch" href="assets/css/nav.css" as="style">
    <link rel="prefetch" href="assets/css/components.css" as="style">
    <link rel="prefetch" href="assets/css/animations.css" as="style">
    <link rel="prefetch" href="/assets/vendor/lucide.min.js" as="script">
    <link rel="prefetch" href="/assets/vendor/lottie-player.js" as="script">
    <link rel="prefetch" href="assets/js/common.js?v=20260528a" as="script">
    <link rel="prefetch" href="assets/js/analytics.js" as="script">
    <link rel="prefetch" href="assets/js/motion.js" as="script">
    <link rel="prefetch" href="assets/js/ui-kit.js?v=20260528a" as="script">
    <link rel="prefetch" href="assets/js/command-palette.js?v=20260425" as="script">
    <link rel="prefetch" href="assets/js/settings-drawer.js?v=20260528a" as="script">
    <link rel="prefetch" href="assets/js/footer.js?v=20260425" as="script">
    <link rel="prefetch" href="assets/js/aurora.js?v=20260506" as="script">
    <link rel="prefetch" href="assets/js/grid-dots.js" as="script">
    <link rel="prefetch" href="assets/js/view-transitions.js" as="script">
    <link rel="prefetch" href="shell-bridge.js" as="script">
    <link rel="prefetch" href="assets/lottie/mentor.json" as="fetch" crossorigin>

    <title>欢迎来到campusquant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* html 兜底背景：与 dashboard 同色(#0d1117)。body 淡出到 0 时,
           露出的是 dashboard 同款深色,而不是绿色,跳转后几乎无视觉断点。 */
        html, body { background-color: #0d1117; }
        /* 注：fade 完全由 JS inline style 控制(避免 CSS class 被 tailwind 等覆盖) */
        /* 确保画布铺满全屏 */
        #splash-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }
        /* 文字层级置于画布之上 */
        #content-wrapper {
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body id="main-body" class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-teal-950 to-teal-800 m-0 overflow-hidden text-white">

    <canvas id="splash-canvas"></canvas>
    
    <div id="content-wrapper" class="flex flex-col items-center justify-center pointer-events-none">
        <h1 id="splash-text" class="text-4xl md:text-5xl font-bold tracking-widest opacity-0 transition-opacity duration-1000" style="text-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            Campusquant多智能体证券分析与模拟沙盘交易平台
        </h1>
        <p id="splash-sub" class="mt-4 text-teal-200 text-lg tracking-wide opacity-0 transition-opacity duration-1000 delay-300">
            重塑你的财富认知
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targetPage = "dashboard.html"; // 你的主页文件名

            // 1. 防打扰机制：本会话内看过的直接跳转
            //    用 sessionStorage —— 关闭浏览器/开新窗口/新标签 都视为"重新打开",会再次播放;
            //    同一标签内的刷新、站内跳回 / 不再重播。正好契合演示场景。
            //    顺手清掉旧版残留的 localStorage 标记,确保已升级用户也能再次看到 splash。
            try { localStorage.removeItem("hasSeenSplash"); } catch (e) {}
            if (sessionStorage.getItem("hasSeenSplash")) {
                window.location.replace(targetPage);
                return;
            }

            const canvas = document.getElementById("splash-canvas");
            const ctx = canvas.getContext("2d");
            const splashText = document.getElementById("splash-text");
            const splashSub = document.getElementById("splash-sub");
            const mainBody = document.getElementById("main-body");

            // 让画布尺寸匹配屏幕大小
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 2. 粒子类定义
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.5; // X轴速度(原 1.5,减为 1/3,更柔)
                    this.vy = (Math.random() - 0.5) * 0.5; // Y轴速度
                    this.baseRadius = Math.random() * 1.8 + 0.8; // 基础大小(略小,更柔)
                    this.radius = this.baseRadius;
                    // 随机赋予青绿色或金色(青绿用浅一档的 #5eead4,视觉更柔)
                    this.color = Math.random() > 0.78 ? "#fbbf24" : "#5eead4";
                }

                update(isFading) {
                    this.x += this.vx;
                    this.y += this.vy;

                    // 边缘反弹
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                    // 如果进入退场阶段，粒子缩小消失
                    if (isFading && this.radius > 0.05) {
                        this.radius -= 0.05;
                    }
                }

                draw() {
                    if (this.radius <= 0.05) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 16;  // 原 10,增大让光晕更朦胧、整体更柔
                    ctx.shadowColor = this.color;
                    ctx.fill();
                }
            }

            // 初始化粒子群
            // 根据屏幕宽度自适应粒子数量（手机少一点，电脑多一点）
            const particleCount = window.innerWidth < 768 ? 32 : 60;  // 原 40/80,稍降密度避免拥挤
            const particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            let animationId;
            let isEnding = false; // 控制退场状态

            // 3. 动画循环
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 更新和绘制每个粒子
                particles.forEach(p => {
                    p.update(isEnding);
                    p.draw();
                });

                // 绘制粒子之间的连线（核心视觉效果）
                if (!isEnding) {
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            // 如果两个粒子距离小于 120，则画一条线
                            if (distance < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                // 根据距离计算线条透明度（越近越清晰）
                                const opacity = 1 - (distance / 120);
                                ctx.strokeStyle = `rgba(94, 234, 212, ${opacity * 0.3})`; // 青绿连线(更浅、更透,柔化)
                                ctx.lineWidth = 1;
                                ctx.stroke();
                            }
                        }
                    }
                }

                animationId = requestAnimationFrame(animate);
            }

            // 启动动画
            animate();

            // 4. 时间轴控制（核心流程）
            
            // a. 0.5秒后，文字淡入
            setTimeout(() => {
                splashText.classList.remove("opacity-0");
                splashSub.classList.remove("opacity-0");
            }, 500);

            // b. 2.5秒后，粒子开始收缩消失，断开连线
            setTimeout(() => {
                isEnding = true;
            }, 2500);

            // c. 3.3 秒后开始最后 1 秒的整体淡出。
            //    用 JS inline style 直接控制 transition + opacity，绕开任何 CSS class 优先级问题
            //    (之前 .fade-out 不生效就是被 tailwind/层叠覆盖,inline style 永远赢)。
            setTimeout(() => {
                mainBody.style.transition = "opacity 1s ease-in-out";
                // 强制 reflow:让浏览器先记下当前的 opacity:1,再变 0 才会真触发过渡
                void mainBody.offsetHeight;
                mainBody.style.opacity = "0";

                // d. 1 秒后(淡出已完成)再跳转,避免"还没淡完就硬切"
                setTimeout(() => {
                    cancelAnimationFrame(animationId);
                    sessionStorage.setItem("hasSeenSplash", "true");
                    // 标记"来自 splash":dashboard 据此跳过自身入场动画,避免叠加 1s 卡顿。
                    // sessionStorage 一次性使用,dashboard 读后立即清除。
                    sessionStorage.setItem("cq_from_splash", "1");
                    window.location.replace(targetPage);
                }, 1000);

            }, 3300);
        });
    </script>
</body>
</html>
